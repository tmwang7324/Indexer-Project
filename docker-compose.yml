# Test database for the new indexer (D19). The full stack (postgres, indexer, api) arrives with ticket 13.
services:
  postgres-test:
    image: postgres:16
    environment:
      POSTGRES_USER: indexer
      POSTGRES_PASSWORD: indexer
      POSTGRES_DB: indexer_test
    ports:
      - "127.0.0.1:5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U indexer -d indexer_test"]
      interval: 2s
      timeout: 3s
      retries: 15
