[pytest]
# importlib mode: test file names may repeat across the layer folders.
addopts = --import-mode=importlib -ra
# tests/ is on the path so the legacy tests can keep `import helpers`.
pythonpath = . tests
testpaths = tests
timeout = 120
markers =
    unit: pure logic, no I/O
    component: one component with its own real dependency (PostgreSQL), rolled back after each test
    integration: components together (database, writer, fake sources)
    e2e: separate indexer and API processes, GraphQL over HTTP
    slow: long-running tests
    legacy: tests of the old shell/Python pipeline
